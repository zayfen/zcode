[package]
name = "zcode"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["zcode contributors"]
description = "A programming agent CLI tool"
license = "MIT"

[workspace]
members = [
    ".",
    "crates/zcode_core",
    "crates/zcode_ui",
    "crates/zcode_requirements",
    "crates/zcode_orchestration",
    "crates/zcode_llm_provider",
    "crates/zcode_capabilities",
    "crates/zcode_cli",
    "crates/zcode_session",
]
resolver = "2"

[dependencies]
zcode_core = { path = "crates/zcode_core" }
zcode_ui = { path = "crates/zcode_ui" }
zcode_requirements = { path = "crates/zcode_requirements" }
zcode_orchestration = { path = "crates/zcode_orchestration" }
zcode_llm_provider = { path = "crates/zcode_llm_provider" }
zcode_capabilities = { path = "crates/zcode_capabilities" }
zcode_cli = { path = "crates/zcode_cli" }
zcode_session = { path = "crates/zcode_session" }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "=4.4.6", features = ["derive", "env"] }

[lib]
name = "zcode"
path = "src/lib.rs"

[[bin]]
name = "zcode"
path = "src/main.rs"

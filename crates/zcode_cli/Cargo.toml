[package]
name = "zcode_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[dependencies]
zcode_capabilities = { path = "../zcode_capabilities" }
zcode_core = { path = "../zcode_core" }
zcode_llm_provider = { path = "../zcode_llm_provider" }
zcode_orchestration = { path = "../zcode_orchestration" }
zcode_requirements = { path = "../zcode_requirements" }
zcode_ui = { path = "../zcode_ui" }

clap = { version = "=4.4.6", features = ["derive", "env"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.9"

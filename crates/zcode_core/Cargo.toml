[package]
name = "zcode_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[dependencies]
directories = "5.0"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
uuid = { version = "=1.6.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.9"

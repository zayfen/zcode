[package]
name = "zcode_llm_provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[dependencies]
zcode_core = { path = "../zcode_core" }
zcode_capabilities = { path = "../zcode_capabilities" }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[package]
name = "zcode_orchestration"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[dependencies]
zcode_core = { path = "../zcode_core" }
zcode_capabilities = { path = "../zcode_capabilities" }
zcode_llm_provider = { path = "../zcode_llm_provider" }
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.23", features = ["v4"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.9"

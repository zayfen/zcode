[package]
name = "zcode_session"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "MIT"

[dependencies]
zcode_core = { path = "../zcode_core" }
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
lancedb = "0.29.0"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.9"
